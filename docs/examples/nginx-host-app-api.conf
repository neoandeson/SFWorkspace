# Host nginx edge for SF (Ubuntu VPS + Certbot).
# Install: copy to /etc/nginx/sites-available/sf, symlink sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.example.com -d api.example.com
#
# Matches SFBE/docker-compose.prod.yml: FE 127.0.0.1:3001, API 127.0.0.1:3002
# Split site files (optional): workspace/deploy/nginx/sf-app.conf + sf-api.conf

upstream sf_fe {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream sf_api {
    server 127.0.0.1:3002;
    keepalive 16;
}

# --- Frontend ---
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://sf_fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# --- API ---
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://sf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

